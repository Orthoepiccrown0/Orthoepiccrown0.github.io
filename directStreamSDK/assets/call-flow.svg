<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How a DirectStream call connects</title>
  <desc id="desc">Two Android apps use the SDK. Cloudflare Worker and D1 authorize an accepted call. Firebase Authentication identifies installations, Realtime Database exchanges signaling, and FCM delivers incoming call hints. After approval, both devices negotiate compatible codecs and use ICE with STUN to find a route. Audio and video flow directly between peers when reachable, or through an optional configured TURN relay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" stroke="#53704d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="650" rx="24" fill="#eef0e5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="480" y="44" fill="#36573c" font-size="13" letter-spacing="2" font-weight="600">COORDINATE THE CALL</text>
    <rect x="180" y="68" width="288" height="126" rx="16" fill="#fffefb" stroke="#dcded3"/>
    <text x="324" y="103" fill="#242d25" font-size="19" font-weight="600">Cloudflare Worker + D1</text>
    <text x="324" y="133" fill="#646b60" font-size="15">Call requests &amp; explicit approval</text>
    <text x="324" y="159" fill="#646b60" font-size="15">Authorized session records</text>
    <rect x="492" y="68" width="288" height="126" rx="16" fill="#fffefb" stroke="#dcded3"/>
    <text x="636" y="103" fill="#242d25" font-size="19" font-weight="600">Firebase</text>
    <text x="636" y="133" fill="#646b60" font-size="15">Auth · Realtime signaling</text>
    <text x="636" y="159" fill="#646b60" font-size="15">FCM incoming-call hints</text>
    <path d="M178 310V250H782V310" stroke="#789566" stroke-width="2" stroke-dasharray="6 6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M324 250v-42M636 250v-42" stroke="#789566" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <text x="480" y="233" fill="#646b60" font-size="14">Approval first. Then signaling and codec negotiation.</text>
    <rect x="48" y="310" width="260" height="162" rx="20" fill="#fffefb" stroke="#dcded3"/>
    <text x="178" y="347" fill="#242d25" font-size="21" font-weight="600">Your Android app</text>
    <rect x="72" y="366" width="212" height="78" rx="12" fill="#e2e8d9"/>
    <text x="178" y="397" fill="#36573c" font-size="18" font-weight="600">DirectStream SDK</text>
    <text x="178" y="422" fill="#646b60" font-size="14">Call UI · WebRTC · Codecs</text>
    <rect x="652" y="310" width="260" height="162" rx="20" fill="#fffefb" stroke="#dcded3"/>
    <text x="782" y="347" fill="#242d25" font-size="21" font-weight="600">The other Android app</text>
    <rect x="676" y="366" width="212" height="78" rx="12" fill="#e2e8d9"/>
    <text x="782" y="397" fill="#36573c" font-size="18" font-weight="600">DirectStream SDK</text>
    <text x="782" y="422" fill="#646b60" font-size="14">Call UI · WebRTC · Codecs</text>
    <path d="M324 399H636" stroke="#36573c" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="480" y="346" fill="#36573c" font-size="17" font-weight="600">Direct audio &amp; video</text>
    <text x="480" y="373" fill="#646b60" font-size="14">When the network allows</text>
    <text x="480" y="432" fill="#646b60" font-size="14">ICE + STUN find a route</text>
    <path d="M178 486v60h172M782 486v60H610" stroke="#789566" stroke-width="2" stroke-dasharray="6 6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="356" y="503" width="248" height="88" rx="16" fill="#f1e3c8"/>
    <text x="480" y="537" fill="#242d25" font-size="18" font-weight="600">Optional TURN relay</text>
    <text x="480" y="563" fill="#646b60" font-size="14">For restrictive networks</text>
    <text x="480" y="625" fill="#646b60" font-size="14">Default provider shown · Configure your own cloud services and optional relay</text>
  </g>
</svg>
