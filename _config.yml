theme: jekyll-theme-slate
url: https://zyatikov.cc
baseurl: ""
# Jekyll serve can replace url with localhost; search metadata stays on this origin.
production_url: https://zyatikov.cc
exclude:
  - README.md
  - _site
  - .jekyll-cache
defaults:
  - scope:
      path: quartz
    values:
      sitemap: true
  - scope:
      path: snello
    values:
      sitemap: true
